# documentation: https://surrealdb.com/docs/surrealdb/installation/running/docker
# slogan: Multi-model database for modern applications (RocksDB & SurrealKV storage).
# category: databases
# tags: surrealdb,database,rocksdb,surrealkv,multi-model,graph,document,sql
# logo: svgs/surrealdb.svg
# port: 8000

services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    user: root
    command:
      - start
      - --log
      - info
      - --bind
      - 0.0.0.0:8000
      - --user
      - ${SERVICE_USER_SURREALDB:-root}
      - --pass
      - ${SERVICE_PASSWORD_SURREALDB}
      - ${SURREAL_STORAGE_ENGINE:-rocksdb:/mydata/surreal.db}
    environment:
      - SERVICE_URL_SURREALDB_8000
      - SURREAL_USER=${SERVICE_USER_SURREALDB:-root}
      - SURREAL_PASS=${SERVICE_PASSWORD_SURREALDB}
      - SURREAL_STORAGE_ENGINE=${SURREAL_STORAGE_ENGINE:-rocksdb:/mydata/surreal.db}
    volumes:
      - surrealdb-data:/mydata
    healthcheck:
      test:
        - CMD
        - /surreal
        - isready
        - --conn
        - http://127.0.0.1:8000
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
